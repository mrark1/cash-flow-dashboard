<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Flow Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="container">

    <h1>💰 Cash Flow Dashboard</h1>

    <div id="warning" class="warning hidden"></div>

    <!-- Salary Section -->
    <div class="card">
        <h2>Set Salary</h2>

        <input
            type="number"
            id="salaryInput"
            placeholder="Enter Total Salary">

        <button id="setSalaryBtn">
            Set Salary
        </button>
    </div>

    <!-- Summary Cards -->
    <div class="summary">

        <div class="summary-card">
            <h3>Total Salary</h3>
            <p id="salaryDisplay">INR 0</p>
        </div>

        <div class="summary-card">
            <h3>Total Expenses</h3>
            <p id="expenseDisplay">INR 0</p>
        </div>

        <div class="summary-card">
            <h3>Remaining Balance</h3>
            <p id="balanceDisplay">INR 0</p>
        </div>

    </div>

    <!-- Add Expense -->
    <div class="card">

        <h2>Add Expense</h2>

        <input
            type="text"
            id="expenseName"
            placeholder="Expense Name">

        <input
            type="number"
            id="expenseAmount"
            placeholder="Expense Amount">

        <button id="addExpenseBtn">
            Add Expense
        </button>

        <p id="errorMsg"></p>

    </div>

    <!-- Currency & PDF -->
    <div class="card">

        <h2>Tools</h2>

        <select id="currencySelect">
            <option value="INR">INR</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
        </select>

        <button id="downloadPdfBtn">
            Download PDF Report
        </button>

    </div>

    <!-- Expense Table -->
    <div class="card">

        <h2>Expense List</h2>

        <table>

            <thead>
                <tr>
                    <th>Expense Name</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="expenseList">
            </tbody>

        </table>

    </div>

    <!-- Chart -->
    <div class="card">

        <h2>Expense Overview</h2>

        <canvas id="expenseChart"></canvas>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
